[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tja-ai-chartgen"
version = "1.0.0"
description = "AI-assisted TJA chart draft generator for Taiko simulators"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "vibub" },
]
keywords = [
    "ai",
    "audio-analysis",
    "chart-generation",
    "rhythm-game",
    "taiko",
    "tja",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/vibub/tja-ai-chartgen"
Repository = "https://github.com/vibub/tja-ai-chartgen"
Issues = "https://github.com/vibub/tja-ai-chartgen/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
tja-ai-chartgen = "tja_ai_chartgen.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
