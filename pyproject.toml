[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tja-ai-chartgen"
version = "0.1.0"
description = "AI-assisted TJA chart draft generator for Taiko simulators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
    "python-dotenv>=1.0.0",
    "litellm>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
tja-ai-chartgen = "tja_ai_chartgen.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
